<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セレクターの通し</title>
<!-- scripts/trial_dashboard.py が trials.csv から生成 -->
<style>
/* 試行記録ダッシュボードの見た目。html-effectiveness の日本語見本 ja/11-status-report.html（weekly 型）の <style> を
   そのまま写したもの（make-html スキルの作法: 見本の CSS は変えない）。足した部品は trial_dashboard.py の EXTRA_CSS にある。
   見本の出所: anthropics/html-effectiveness（MIT） */
  :root {
    --ivory: #FAF9F5;
    --slate: #141413;
    --clay: #D97757;
    --oat: #E3DACC;
    --olive: #788C5D;
    --rust: #B04A3F;
    --gray-100: #F0EEE6;
    --gray-300: #D1CFC5;
    --gray-500: #87867F;
    --gray-700: #3D3D3A;
    --white: #FFFFFF;

    --serif: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", ui-serif, Georgia, serif;
    --sans: "Yu Gothic Medium", "Yu Gothic", "YuGothic", "Hiragino Sans", "Noto Sans JP", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;

    --radius-panel: 12px;
    --radius-row: 8px;
    --border: 1.5px solid var(--gray-300);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 56px 24px 120px;
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
  }

  /* ---------- Header ---------- */
  header {
    margin-bottom: 40px;
  }
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 8px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 38px;
    letter-spacing: 0;
    margin: 0;
  }
  .auto-pill {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gray-500);
    background: var(--gray-100);
    border: var(--border);
    border-radius: 999px;
    padding: 5px 11px;
    white-space: nowrap;
  }
  .date-range {
    color: var(--gray-500);
    font-size: 14px;
  }
  .date-range .repo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--gray-700);
  }

  /* ---------- Sections ---------- */
  section {
    margin-bottom: 52px;
  }
  h2 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0;
    margin: 0 0 6px;
  }
  hr.rule {
    border: none;
    border-top: 1px solid var(--gray-300);
    margin: 0 0 22px;
  }

  /* ---------- Summary band ---------- */
  .summary-band {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 720px) {
    .summary-band { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-card {
    background: var(--white);
    border: var(--border);
    border-radius: var(--radius-panel);
    padding: 20px 22px 18px;
  }
  .stat-card.warn {
    border-left: 4px solid var(--clay);
    padding-left: 19px;
  }
  .stat-num {
    font-family: var(--serif);
    font-size: 44px;
    font-weight: 500;
    line-height: 1;
    color: var(--slate);
    margin-bottom: 8px;
  }
  .stat-label {
    font-family: var(--sans);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gray-500);
  }
  .stat-delta {
    font-family: var(--mono);
    font-size: 11px;
    margin-top: 6px;
  }
  .stat-delta.up { color: var(--olive); }
  .stat-delta.flat { color: var(--gray-500); }

  /* ---------- Highlights ---------- */
  .highlights {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .highlights li {
    position: relative;
    padding: 0 0 14px 26px;
    font-size: 15px;
    color: var(--gray-700);
  }
  .highlights li::before {
    content: "";
    position: absolute;
    left: 6px;
    top: 8px;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: var(--clay);
  }
  .highlights li strong {
    color: var(--slate);
    font-weight: 600;
  }

  /* ---------- Shipped table ---------- */
  table.shipped {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--white);
    border: var(--border);
    border-radius: var(--radius-panel);
    overflow: hidden;
  }
  table.shipped thead th {
    text-align: left;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gray-500);
    background: var(--gray-100);
    padding: 12px 16px;
    border-bottom: 1px solid var(--gray-300);
  }
  table.shipped tbody td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--gray-100);
    font-size: 14px;
    vertical-align: middle;
  }
  table.shipped tbody tr:last-child td {
    border-bottom: none;
  }
  table.shipped tbody tr:hover {
    background: var(--ivory);
  }
  .pr-link {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--clay);
    text-decoration: none;
    border-bottom: 1px dotted transparent;
  }
  .pr-link:hover {
    border-bottom-color: var(--clay);
  }
  .author {
    color: var(--gray-700);
    font-size: 13px;
  }
  .risk {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--gray-500);
  }
  .risk-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .risk-dot.low { background: var(--olive); }
  .risk-dot.med { background: var(--clay); }
  .risk-dot.high { background: var(--rust); }

  /* ---------- Velocity chart ---------- */
  .chart-panel {
    background: var(--white);
    border: var(--border);
    border-radius: var(--radius-panel);
    padding: 24px 28px 18px;
  }
  .chart-panel svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .chart-caption {
    font-size: 12px;
    color: var(--gray-500);
    margin-top: 12px;
  }

  /* ---------- Carryover ---------- */
  .carryover {
    background: var(--oat);
    border-radius: var(--radius-panel);
    padding: 20px 22px;
  }
  .carry-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 8px 0;
  }
  .carry-item + .carry-item {
    border-top: 1px solid rgba(20, 20, 19, 0.08);
  }
  .carry-tag {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gray-700);
    background: var(--ivory);
    border-radius: 4px;
    padding: 3px 7px;
    flex-shrink: 0;
  }
  .carry-body {
    font-size: 14px;
    color: var(--gray-700);
  }
  .carry-body .who {
    color: var(--gray-500);
    font-size: 12px;
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 64px;
    padding-top: 20px;
    border-top: 1px solid var(--gray-300);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gray-500);
  }
  /* 和文の詰め組み（候補 B・2026-08-22 確定） */
  body, h1, h2, h3 { font-feature-settings: "palt" 1, "kern" 1; }

  /* ---------- 足した部品（trial_dashboard.py） ---------- */
  .table-wrap { overflow-x: auto; }
  table.shipped td.num, table.shipped th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.shipped thead th { white-space: nowrap; padding: 11px 8px; }
  table.shipped tbody td { padding: 11px 8px; }
  table.shipped .risk, table.shipped .author, table.shipped .strip { white-space: nowrap; }
  table.shipped tbody td.note { white-space: normal; min-width: 12em; color: var(--gray-700); font-size: 13px; }
  table.shipped tbody tr.idle td { color: var(--gray-500); }
  table.shipped tbody tr.total td { font-weight: 600; border-top: 2px solid var(--gray-300); }
  table.shipped tbody tr.ref td { color: var(--gray-500); }
  .over-mark { color: var(--rust); }
  .mission-en { display: block; color: var(--gray-500); font-size: 11px; }
  .risk-dot.none { background: var(--gray-300); }
  .stat-num small { font-size: 16px; color: var(--gray-500); }
  .stat-delta.down { color: var(--rust); }
  .meter { display: inline-block; width: 72px; height: 7px; border-radius: 4px; background: var(--gray-100);
           vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .meter b { display: block; height: 100%; background: var(--olive); }
  .meter.over b { background: var(--rust); }
  .strip i { display: inline-block; width: 7px; height: 13px; border-radius: 2px; margin-right: 2px; vertical-align: middle; }
  .strip .low { background: var(--olive); } .strip .med { background: var(--clay); }
  .strip .high { background: var(--rust); } .strip .none { background: var(--gray-300); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: -8px 0 14px; }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--gray-500); font-size: 13px; }
  .lead { color: var(--gray-700); font-size: 14px; margin: -10px 0 16px; }
  .gap { height: 14px; }
  .scope-note { color: var(--gray-500); font-size: 13px; margin-top: 6px; }
  .scope-note a { color: var(--clay); }
  .sub-head { font-size: 15px; margin: 22px 0 10px; color: var(--gray-700); }
  footer { overflow-wrap: anywhere; }
  /* 狭い画面（Obsidian の画面分割など）: 見出しも折り返し、余白・バー・メモの最小幅を詰める */
  @media (max-width: 720px) {
    body { padding-left: 12px; padding-right: 12px; }
    table.shipped thead th { white-space: normal; }
    table.shipped thead th, table.shipped tbody td { padding: 8px 5px; font-size: 13px; }
    table.shipped tbody td.note { min-width: 6em; }
    table.shipped .strip { white-space: normal; }
    table.shipped .meter { width: 44px; }
  }
</style>
</head>
<body>
  <div class="page">
<header><div class="header-top"><h1>セレクターの通し</h1><span class="auto-pill">自動生成</span></div><div class="date-range">記録はまだありません</div><div class="scope-note">selector.py から走らせた記録だけ（数える前の記録もふくむ）。<a href="dashboard_selector_coach.html">コーチの selector_coach.py の通し</a>・<a href="dashboard.html">チームのダッシュボード</a>・<a href="dashboard_coach.html">コーチ確認用のダッシュボード</a> へ。</div></header><section><h2>通し</h2><hr class="rule"><p>セレクター経由の記録はまだありません。</p></section><footer>出典: C:\Projects\FLL-2026-2027-Season-Robot-Game\docs\trials\trials.csv &nbsp;&mdash;&nbsp; 2026年10月23日 21:19 生成</footer>
  </div>
</body>
</html>
