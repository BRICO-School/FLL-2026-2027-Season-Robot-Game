name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (Python は .python-version、依存は uv.lock に固定)
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: pybricksdev が import できるか
        run: uv run python -m pybricksdev --version
